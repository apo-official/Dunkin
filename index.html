:root{--bg:#fff;--surface:#f7f4f2;--text:#2a1a14;--muted:#6f5d55;--accent:#ff671f;--accent2:#e11d74;--on:#fff;--border:#eadfd9;--hdr:#ffffffee;color-scheme:light}
:root[data-theme=pink]{--bg:#fff0f6;--surface:#ffffff;--text:#4a1730;--muted:#8a5570;--accent:#e11d74;--accent2:#ff671f;--border:#f6cadf;--hdr:#fff0f6ee}
:root[data-theme=orange]{--bg:#fff3e6;--surface:#ffffff;--text:#3b1d08;--muted:#855a3c;--accent:#ff671f;--accent2:#e11d74;--border:#f9d4b3;--hdr:#fff3e6ee}
:root[data-theme=dark]{--bg:#17100d;--surface:#251a16;--text:#f7ece6;--muted:#b9a79e;--accent:#ff671f;--accent2:#ff4f9a;--border:#3a2b25;--hdr:#17100dee;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme]){--bg:#17100d;--surface:#251a16;--text:#f7ece6;--muted:#b9a79e;--border:#3a2b25;--hdr:#17100dee;color-scheme:dark}}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
:focus{outline:none}
:focus-visible{outline:none}
button,a,.chip,.card{-webkit-user-select:none;user-select:none;-webkit-appearance:none;appearance:none;touch-action:manipulation}
a::selection,button::selection{background:transparent}
html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--text);font-family:"Noto Sans Georgian",system-ui,sans-serif;line-height:1.55;overflow-x:hidden;transition:background .25s,color .25s}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
h1,h2,h3,.logo{font-family:DunkinSans,"Noto Sans Georgian",sans-serif;font-weight:800;letter-spacing:.01em}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
.ribbon{background:var(--accent2);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:6px 10px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;gap:12px;height:64px}
.logo img{height:26px;width:auto}
nav{display:flex;gap:4px;margin-left:auto;align-items:center}
nav a{padding:8px 12px;border-radius:99px;font-weight:600;font-size:15px}
nav a:hover{background:var(--surface)}
.tools{display:flex;gap:8px;align-items:center}
.lang{border:2px solid var(--accent);color:var(--accent);border-radius:99px;padding:5px 12px;font-weight:800;font-size:13px}
.lang:active,.btn:active,.chip:active{transform:scale(.97)}
.burger{display:none;width:40px;height:40px;border-radius:12px;background:var(--surface);font-size:20px}
.themes{display:flex;gap:7px;align-items:center}
.sw{width:24px;height:24px;border-radius:50%;border:2px solid var(--border)}
.sw[aria-pressed=true]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.btn{display:inline-block;background:var(--accent);color:var(--on);padding:11px 22px;border-radius:99px;font-weight:800;font-size:15px;transition:transform .1s,filter .2s}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:var(--accent2)}
.btn.ghost{background:transparent;color:var(--accent);border:2px solid var(--accent)}
.hero{position:relative;overflow:hidden;background:var(--surface)}
.slide{display:none}.slide.on{display:block}
.slide img{width:100%;height:auto;aspect-ratio:1920/700;object-fit:cover;min-height:170px}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:8px}
.dots button{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.6}
.dots button.on{background:var(--accent);opacity:1}
section{padding:46px 0}
h2{font-size:clamp(26px,5vw,38px);color:var(--accent);margin-bottom:6px}
.sub{color:var(--muted);margin-bottom:22px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-weight:600;font-size:14px}
.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:12px;text-align:center;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card img{width:100%;aspect-ratio:430/487;object-fit:contain}
.card h3{font-size:16px;line-height:1.25}
.tag{font-size:12px;color:var(--muted)}
.card .btn{padding:8px 12px;font-size:13px;margin-top:auto}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px}
.two{display:grid;gap:24px;grid-template-columns:1fr 1fr;align-items:center}
.pic{border-radius:24px;overflow:hidden}
.band{background:var(--accent);color:var(--on)}
.band h2{color:var(--on)}.band .sub{color:var(--on);opacity:.9}
.band .btn{background:#fff;color:var(--accent)}
.info{display:grid;gap:12px;margin-top:10px}
.info a,.info div{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;font-weight:600}
.soc{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.soc span{background:var(--accent);color:var(--on);border-radius:99px;padding:6px 14px;font-weight:700;font-size:14px}
footer{background:var(--surface);border-top:1px solid var(--border);padding:30px 0 calc(30px + env(safe-area-inset-bottom,0px));text-align:center;color:var(--muted);font-size:13px}
footer img{height:24px;margin:0 auto 10px}
.badge{display:inline-block;background:var(--accent2);color:#fff;border-radius:99px;padding:5px 14px;font-weight:800;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1}
@media(max-width:820px){
nav{position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px solid var(--border);padding:8px 18px 14px;display:none;margin:0}
nav.open{display:flex}
.burger{display:block}.tools{margin-left:auto}
.two{grid-template-columns:1fr}
.logo img{height:22px}
}
@media(max-width:420px){.themes{gap:5px}.sw{width:20px;height:20px}.lang{padding:4px 9px}}
/* ---- animations ---- */
:root{--ease:cubic-bezier(.22,1,.36,1)}
body,header,.card,.chip,.btn,.sw,.lang,.info a,.info div,section,footer,.burger{transition:background-color .35s ease,color .35s ease,border-color .35s ease,transform .35s var(--ease),box-shadow .35s var(--ease),filter .2s}
header{transition:box-shadow .3s ease,background-color .35s ease}
header.sc{box-shadow:0 6px 24px rgba(0,0,0,.12)}
.logo img{transition:transform .5s var(--ease)}
.logo:hover img{transform:rotate(-4deg) scale(1.06)}
.slide.on{animation:heroIn .9s var(--ease) both}
.slide.on img{animation:kb 9s ease-out both}
@keyframes heroIn{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1)}}
.dots button{transition:width .35s var(--ease),background-color .3s,opacity .3s}
.dots button.on{width:26px;border-radius:99px}
.js .rv{opacity:0;transform:translateY(28px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.js .rv.in{opacity:1;transform:none}
.card{animation:pop .6s var(--ease) both;animation-delay:calc(var(--n,0)*70ms)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-6px);box-shadow:0 14px 30px rgba(0,0,0,.14)}
.card img{transition:transform .5s var(--ease)}
.card:hover img{transform:scale(1.08) rotate(-2deg)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(0,0,0,.18)}
.btn:active,.lang:active,.chip:active,.sw:active{transform:scale(.95)}
.chip:hover{transform:translateY(-2px)}
.sw:hover{transform:scale(1.18)}
.pic img{animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) scale(1.02)}}
.band img{animation:float 5s ease-in-out infinite}
.badge{animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.info a:hover,.info div:hover{transform:translateX(6px)}
.soc span{transition:transform .3s var(--ease);display:inline-block}
.soc span:hover{transform:translateY(-3px) scale(1.06)}
nav.open{animation:drop .35s var(--ease) both}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
#toast{transform:translate(-50%,16px);transition:opacity .3s ease,transform .4s var(--ease)}
#toast.on{transform:translate(-50%,0)}
.hl{animation:fade .45s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.js .rv{opacity:1;transform:none}}
</style>

 var s=e.target.closest(".sw");if(s)setTheme(s.dataset.t);
